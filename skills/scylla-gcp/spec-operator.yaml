# yaml-language-server: $schema=https://api.omnistrate.cloud/2022-09-01-00/schema/service-spec-schema.json
# ScyllaDB on Omnistrate -- GCP (backups to Google Cloud Storage), local NVMe storage.
# Fill every <PLACEHOLDER> before building (SKILL.md, step 2).
name: ScyllaDB GCP
tenancyType: CUSTOM_TENANCY
deployment:
  hostedDeployment:
    gcpProjectId: "<GCP_PROJECT_ID>"
    gcpProjectNumber: "<GCP_PROJECT_NUMBER>"
    gcpServiceAccountEmail: "<GCP_BOOTSTRAP_SA_EMAIL>"
features:
  INTERNAL:
    logs:
  CUSTOMER:
    logs:
loadBalancers:
  https: []
  tcp:
    - name: cql
      description: TCP ingress for CQL (port 9042).
      ports:
        - associatedResourceKeys:
            - cqlProxy
          ingressPort: 9042
          backendPort: 9042
services:
  - name: scylladb
    description: ScyllaDB cluster on local NVMe, managed by the ScyllaDB Operator.
    capabilities:
      enableMultiZone: false
      backupConfiguration:
        backupRetentionInDays: 7
        backupPeriodInHours: 24
        snapshotBeforeDeletion: false
    compute:
      rootVolumeSizeGi: 50
      instanceTypes:
        - apiParam: gcpInstanceType
          cloudProvider: gcp
          configurationOverrides:
            EphemeralStorageLocalSsdConfig:
              localSsdCount: 2
    network:
      ports:
        - 9042
    apiParameters:
      - key: gcpInstanceType
        name: Instance Type
        description: Machine type with local NVMe for the ScyllaDB nodes (one member per node).
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: n2-highmem-4
        options:
          - n2-highmem-4
          - n2-highmem-8
          - n2-highmem-16
          - n2-standard-8
          - n2-standard-16
      - key: memberCount
        name: Members
        description: Number of ScyllaDB members (nodes). Use 3+ with replication factor 3 for HA.
        type: Float64
        modifiable: true
        required: false
        export: true
        defaultValue: '3'
        limits:
          min: 1
          max: 30
      - key: cpuQuantity
        name: CPU per Member
        description: Whole CPUs for each ScyllaDB container (requests = limits). Leave ~1 CPU of the node free for system pods.
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: '3'
        regex: ^[1-9][0-9]*$
      - key: memoryQuantity
        name: Memory per Member
        description: Memory for each ScyllaDB container (requests = limits), e.g. 24Gi. Leave headroom for system pods.
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: 24Gi
        regex: ^[1-9][0-9]*(Mi|Gi)$
      - key: storageGiB
        name: Storage GiB (advisory)
        description: 'Local NVMe volume request per member. Advisory: each member can use the whole local array of its node. To get more storage, change the instance type.'
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: '500'
        regex: ^[1-9][0-9]*$
      - key: scyllaVersion
        name: ScyllaDB Version
        description: ScyllaDB image tag. Changing it performs a rolling upgrade.
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: 2026.2.5
        regex: ^[0-9]+\.[0-9]+\.[0-9]+$
      - key: developerMode
        name: Developer Mode
        description: Relax ScyllaDB production checks (for small or test machines).
        type: String
        modifiable: true
        required: false
        export: true
        defaultValue: 'false'
        options:
          - 'false'
          - 'true'
      - key: adminUsername
        name: Admin Username
        description: CQL superuser created at provisioning.
        type: String
        modifiable: false
        required: false
        export: true
        defaultValue: admin
        regex: ^[a-z][a-z0-9_]{0,47}$
      - key: adminPassword
        name: Admin Password
        description: Password of the CQL superuser.
        type: Password
        modifiable: false
        required: true
        export: true
        regex: ^[A-Za-z0-9!@#%^&*()_+=.-]{12,128}$
      - key: backupGcsBucketName
        name: Backup GCS Bucket Name
        description: GCS bucket for Scylla Manager backups (gcs-bucket output bucketName).
        type: String
        modifiable: true
        required: false
        export: false
      - key: backupGcsCredentials
        name: Backup GCS Credentials
        description: Base64 service-account JSON key for the backup bucket (gcs-bucket output credentialsBase64).
        type: Password
        modifiable: true
        required: false
        export: false
    operatorCRDConfiguration:
      helmChartDependencies: []
    customWorkflows:
      - verb: replaceMember
        displayName: Replace Member
        description: 'Replace one ScyllaDB member: its local NVMe volume is wiped and its data re-streamed from the other replicas. Needs 2+ members and RF >= 2.'
        apiParameters:
          - key: member
            displayName: Member
            type: String
            required: true
            description: Member (pod) name, e.g. <instance-id>-dc1-rack1-2.
        workflow:
          entrypoint: replacemember
          activeDeadlineSeconds: 21600
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: member
                value: "{{ $var.member }}"
          templates:
            - name: replacemember
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: member
              dag:
                tasks:
                  - name: deletereplace
                    template: delete-job
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: jobName
                          value: "{{inputs.parameters.instanceId}}-replace"
                  - name: replace
                    template: run-ops-job
                    dependencies:
                      - deletereplace
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: op
                          value: replace
                        - name: arg
                          value: "{{inputs.parameters.member}}"
                        - name: jobName
                          value: "{{inputs.parameters.instanceId}}-replace"
                        - name: instanceType
                          value: ''
            - name: delete-job
              inputs:
                parameters:
                  - name: namespace
                  - name: jobName
              resource:
                action: delete
                flags:
                  - --ignore-not-found=true
                manifest: |
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: "{{inputs.parameters.jobName}}"
                    namespace: "{{inputs.parameters.namespace}}"
            - name: run-ops-job
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: op
                  - name: arg
                  - name: jobName
                  - name: instanceType
              resource:
                action: apply
                successCondition: status.succeeded > 0
                failureCondition: status.failed > 0
                manifest: |
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: "{{inputs.parameters.jobName}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels: &id001
                      app.kubernetes.io/name: scylla-ops
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  spec:
                    backoffLimit: 0
                    activeDeadlineSeconds: 21600
                    ttlSecondsAfterFinished: 604800
                    template:
                      metadata:
                        labels: *id001
                      spec:
                        restartPolicy: Never
                        serviceAccountName: "{{inputs.parameters.instanceId}}-ops"
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: omnistrate.com/control-plane
                                      operator: Exists
                        tolerations:
                          - key: CriticalAddonsOnly
                            operator: Exists
                            effect: NoSchedule
                          - key: components.gke.io/gke-managed-components
                            operator: Exists
                            effect: NoSchedule
                        initContainers:
                          - name: sctool
                            image: docker.io/scylladb/scylla-manager:3.12.0
                            command:
                              - cp
                              - /usr/bin/sctool
                              - /tools/sctool
                            volumeMounts:
                              - name: tools
                                mountPath: /tools
                        containers:
                          - name: ops
                            image: docker.io/alpine/kubectl:1.34.1
                            command:
                              - /bin/sh
                              - /scripts/ops.sh
                            env:
                              - name: OP
                                value: "{{inputs.parameters.op}}"
                              - name: ARG
                                value: "{{inputs.parameters.arg}}"
                              - name: NS
                                value: "{{inputs.parameters.namespace}}"
                              - name: CLUSTER
                                value: "{{inputs.parameters.instanceId}}"
                              - name: JOB_NAME
                                value: "{{inputs.parameters.jobName}}"
                              - name: DESIRED_INSTANCE_TYPE
                                value: "{{inputs.parameters.instanceType}}"
                              - name: SCYLLA_MANAGER_API_URL
                                value: http://scylla-manager.scylla-manager.svc/api/v1
                            envFrom:
                              - secretRef:
                                  name: "{{inputs.parameters.instanceId}}-ops"
                            resources:
                              requests:
                                cpu: 50m
                                memory: 64Mi
                            volumeMounts:
                              - name: tools
                                mountPath: /tools
                              - name: scripts
                                mountPath: /scripts
                        volumes:
                          - name: tools
                            emptyDir: {}
                          - name: scripts
                            configMap:
                              name: "{{inputs.parameters.instanceId}}-ops-scripts"
      - verb: replaceMemberVM
        displayName: Replace Member VM
        description: 'Move one ScyllaDB member to a different VM: cordon its node, then replace the member there. Needs 2+ members and RF >= 2.'
        apiParameters:
          - key: member
            displayName: Member
            type: String
            required: true
            description: Member (pod) name, e.g. <instance-id>-dc1-rack1-2.
        workflow:
          entrypoint: replacemembervm
          activeDeadlineSeconds: 21600
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: member
                value: "{{ $var.member }}"
          templates:
            - name: replacemembervm
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: member
              dag:
                tasks:
                  - name: deletereplace
                    template: delete-job
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: jobName
                          value: "{{inputs.parameters.instanceId}}-replace-vm"
                  - name: replace
                    template: run-ops-job
                    dependencies:
                      - deletereplace
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: op
                          value: replace-vm
                        - name: arg
                          value: "{{inputs.parameters.member}}"
                        - name: jobName
                          value: "{{inputs.parameters.instanceId}}-replace-vm"
                        - name: instanceType
                          value: ''
            - name: delete-job
              inputs:
                parameters:
                  - name: namespace
                  - name: jobName
              resource:
                action: delete
                flags:
                  - --ignore-not-found=true
                manifest: |
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: "{{inputs.parameters.jobName}}"
                    namespace: "{{inputs.parameters.namespace}}"
            - name: run-ops-job
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: op
                  - name: arg
                  - name: jobName
                  - name: instanceType
              resource:
                action: apply
                successCondition: status.succeeded > 0
                failureCondition: status.failed > 0
                manifest: |
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: "{{inputs.parameters.jobName}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels: &id001
                      app.kubernetes.io/name: scylla-ops
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  spec:
                    backoffLimit: 0
                    activeDeadlineSeconds: 21600
                    ttlSecondsAfterFinished: 604800
                    template:
                      metadata:
                        labels: *id001
                      spec:
                        restartPolicy: Never
                        serviceAccountName: "{{inputs.parameters.instanceId}}-ops"
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: omnistrate.com/control-plane
                                      operator: Exists
                        tolerations:
                          - key: CriticalAddonsOnly
                            operator: Exists
                            effect: NoSchedule
                          - key: components.gke.io/gke-managed-components
                            operator: Exists
                            effect: NoSchedule
                        initContainers:
                          - name: sctool
                            image: docker.io/scylladb/scylla-manager:3.12.0
                            command:
                              - cp
                              - /usr/bin/sctool
                              - /tools/sctool
                            volumeMounts:
                              - name: tools
                                mountPath: /tools
                        containers:
                          - name: ops
                            image: docker.io/alpine/kubectl:1.34.1
                            command:
                              - /bin/sh
                              - /scripts/ops.sh
                            env:
                              - name: OP
                                value: "{{inputs.parameters.op}}"
                              - name: ARG
                                value: "{{inputs.parameters.arg}}"
                              - name: NS
                                value: "{{inputs.parameters.namespace}}"
                              - name: CLUSTER
                                value: "{{inputs.parameters.instanceId}}"
                              - name: JOB_NAME
                                value: "{{inputs.parameters.jobName}}"
                              - name: DESIRED_INSTANCE_TYPE
                                value: "{{inputs.parameters.instanceType}}"
                              - name: SCYLLA_MANAGER_API_URL
                                value: http://scylla-manager.scylla-manager.svc/api/v1
                            envFrom:
                              - secretRef:
                                  name: "{{inputs.parameters.instanceId}}-ops"
                            resources:
                              requests:
                                cpu: 50m
                                memory: 64Mi
                            volumeMounts:
                              - name: tools
                                mountPath: /tools
                              - name: scripts
                                mountPath: /scripts
                        volumes:
                          - name: tools
                            emptyDir: {}
                          - name: scripts
                            configMap:
                              name: "{{inputs.parameters.instanceId}}-ops-scripts"
    systemWorkflows:
      create:
        outputParameters: &id001
          members: $tasks.applycluster.resource.status.members
          readyMembers: $tasks.applycluster.resource.status.readyMembers
          availableMembers: $tasks.applycluster.resource.status.availableMembers
          managerId: $tasks.applycluster.resource.status.managerId
        workflow:
          entrypoint: create
          activeDeadlineSeconds: 5400
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: memberCount
                value: "{{ $var.memberCount }}"
              - name: cpuQuantity
                value: "{{ $var.cpuQuantity }}"
              - name: memoryQuantity
                value: "{{ $var.memoryQuantity }}"
              - name: storageGiB
                value: "{{ $var.storageGiB }}"
              - name: scyllaVersion
                value: "{{ $var.scyllaVersion }}"
              - name: developerMode
                value: "{{ $var.developerMode }}"
              - name: region
                value: "{{ $sys.deploymentCell.region }}"
              - name: instanceType
                value: "{{ $var.gcpInstanceType }}"
              - name: planId
                value: "{{ $func.tolower($sys.deployment.planID) }}"
              - name: adminUsername
                value: "{{ $var.adminUsername }}"
              - name: adminPassword
                value: "{{ $var.adminPassword }}"
              - name: contactHost
                value: "{{ $sys.network.externalClusterEndpoint }}"
              - name: backupGcsBucketName
                value: "{{ $var.backupGcsBucketName }}"
              - name: backupGcsCredentials
                value: "{{ $var.backupGcsCredentials }}"
          templates:
            - name: create
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: memberCount
                  - name: cpuQuantity
                  - name: memoryQuantity
                  - name: storageGiB
                  - name: scyllaVersion
                  - name: developerMode
                  - name: region
                  - name: instanceType
                  - name: planId
                  - name: adminUsername
                  - name: adminPassword
                  - name: contactHost
                  - name: backupGcsBucketName
                  - name: backupGcsCredentials
              dag:
                tasks:
                  - name: agentconfig
                    template: apply-agent-config
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupGcsBucketName
                          value: "{{inputs.parameters.backupGcsBucketName}}"
                        - name: backupGcsCredentials
                          value: "{{inputs.parameters.backupGcsCredentials}}"
                  - name: gcscredentials
                    template: apply-gcs-credentials
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupGcsCredentials
                          value: "{{inputs.parameters.backupGcsCredentials}}"
                  - name: opssecret
                    template: apply-ops-secret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: adminUsername
                          value: "{{inputs.parameters.adminUsername}}"
                        - name: adminPassword
                          value: "{{inputs.parameters.adminPassword}}"
                        - name: backupGcsBucketName
                          value: "{{inputs.parameters.backupGcsBucketName}}"
                        - name: contactHost
                          value: "{{inputs.parameters.contactHost}}"
                  - name: scyllaconfig
                    template: apply-scylla-config
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsscripts
                    template: apply-ops-scripts
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opssa
                    template: apply-ops-sa
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsrole
                    template: apply-ops-role
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsrolebinding
                    template: apply-ops-rolebinding
                    dependencies:
                      - opssa
                      - opsrole
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsclusterrole
                    template: apply-ops-clusterrole
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsclusterrolebinding
                    template: apply-ops-clusterrolebinding
                    dependencies:
                      - opssa
                      - opsclusterrole
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: applycluster
                    template: apply-cluster
                    dependencies:
                      - agentconfig
                      - scyllaconfig
                      - gcscredentials
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: memberCount
                          value: "{{inputs.parameters.memberCount}}"
                        - name: cpuQuantity
                          value: "{{inputs.parameters.cpuQuantity}}"
                        - name: memoryQuantity
                          value: "{{inputs.parameters.memoryQuantity}}"
                        - name: storageGiB
                          value: "{{inputs.parameters.storageGiB}}"
                        - name: scyllaVersion
                          value: "{{inputs.parameters.scyllaVersion}}"
                        - name: developerMode
                          value: "{{inputs.parameters.developerMode}}"
                        - name: region
                          value: "{{inputs.parameters.region}}"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
                        - name: planId
                          value: "{{inputs.parameters.planId}}"
                  - name: deleteauthjob
                    template: delete-job
                    dependencies:
                      - applycluster
                      - opssecret
                      - opsscripts
                      - opsrolebinding
                      - opsclusterrolebinding
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: jobName
                          value: "{{inputs.parameters.instanceId}}-auth"
                  - name: authjob
                    template: run-ops-job
                    dependencies:
                      - deleteauthjob
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: op
                          value: auth
                        - name: arg
                          value: ''
                        - name: jobName
                          value: "{{inputs.parameters.instanceId}}-auth"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
            - name: apply-agent-config
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: backupGcsBucketName
                  - name: backupGcsCredentials
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-agent-config"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  type: Opaque
                  stringData:
                    scylla-manager-agent.yaml: |
                      gcs:
                        service_account_file: /etc/scylla-manager-agent/gcs/credentials.json
            - name: apply-gcs-credentials
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: backupGcsCredentials
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-gcs-credentials"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  type: Opaque
                  data:
                    credentials.json: "{{inputs.parameters.backupGcsCredentials}}"
            - name: apply-ops-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: adminUsername
                  - name: adminPassword
                  - name: backupGcsBucketName
                  - name: contactHost
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  type: Opaque
                  stringData:
                    ADMIN_USER: "{{inputs.parameters.adminUsername}}"
                    ADMIN_PASSWORD: "{{inputs.parameters.adminPassword}}"
                    LOCATION: "gcs:{{inputs.parameters.backupGcsBucketName}}"
                    CONTACT_HOST: "{{inputs.parameters.contactHost}}"
            - name: apply-scylla-config
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-scylla-config"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  data:
                    scylla.yaml: |
                      authenticator: PasswordAuthenticator
                      authorizer: CassandraAuthorizer
            - name: apply-ops-scripts
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops-scripts"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  data:
                    ops.sh: |
                      #!/bin/sh
                      # ScyllaDB lifecycle operations run as Kubernetes Jobs by the Omnistrate
                      # workflows. One script, selected by $OP:
                      #   auth           create the customer's CQL superuser (create/restore/start)
                      #   backup         Scylla Manager backup; records the snapshot tag for restore
                      #   delete-backup  delete the files of one Omnistrate snapshot
                      #   restore        restore schema + tables from snapshot tag $ARG
                      #   stop           backup, then delete the cluster and its local NVMe volumes
                      #   start          restore the snapshot taken by stop (cluster re-created by the workflow)
                      #   reconcile      wait for a modify to settle; replace members whose local
                      #                  volume is stranded on an old node pool (instance-type change)
                      #   restart        rolling restart of every member, one pod at a time
                      #   replace        replace member $ARG (fresh local volume, data re-streamed)
                      #   replace-vm     cordon member $ARG's node, then replace it onto another node
                      # NOTE: never write a double opening brace here -- the workflow engine would
                      # try to template it.
                      set -eu
                      export PATH="/tools:$PATH"
                      : "${NS:?}" "${CLUSTER:?}" "${OP:?}"
                      ARG="${ARG:-}"
                      TIMEOUT="${TIMEOUT:-21000}"
                      START=$(date +%s)
                      LAST_LOG=0

                      log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) [$OP] $*"; }
                      die() { log "ERROR: $*"; exit 1; }
                      k() { kubectl -n "$NS" "$@"; }
                      check_deadline() { [ $(($(date +%s) - START)) -lt "$TIMEOUT" ] || die "timed out after ${TIMEOUT}s"; }
                      every_minute() { now=$(date +%s); if [ $((now - LAST_LOG)) -ge 60 ]; then LAST_LOG=$now; log "$*"; fi; }
                      sc() { k get scyllacluster "$CLUSTER" -o jsonpath="$1" 2>/dev/null || true; }
                      cluster_exists() { k get scyllacluster "$CLUSTER" >/dev/null 2>&1; }
                      cm_get() { k get configmap "$1" -o jsonpath="{.data.$2}" 2>/dev/null || true; }
                      cm_put() { name=$1; shift; k create configmap "$name" "$@" --dry-run=client -o yaml | k apply -f - >/dev/null; }
                      SEL="scylla/cluster=$CLUSTER,scylla-operator.scylladb.com/pod-type=scylladb-node"
                      members() { k get pod -l "$SEL" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'; }

                      status_line() {
                        echo "want=$(sc '{.spec.datacenter.racks[0].members}') members=$(sc '{.status.members}') ready=$(sc '{.status.readyMembers}') available=$(sc '{.status.availableMembers}') updated=$(sc '{.status.racks.rack1.updatedMembers}') generation=$(sc '{.metadata.generation}')/$(sc '{.status.observedGeneration}')"
                      }

                      # All members exist, are ready and run the latest spec, and the operator is idle.
                      cluster_ready() {
                        want=$(sc '{.spec.datacenter.racks[0].members}')
                        [ -n "$want" ] || return 1
                        [ "$(sc '{.metadata.generation}')" = "$(sc '{.status.observedGeneration}')" ] || return 1
                        [ "$(sc '{.status.members}')" = "$want" ] || return 1
                        [ "$(sc '{.status.readyMembers}')" = "$want" ] || return 1
                        [ "$(sc '{.status.availableMembers}')" = "$want" ] || return 1
                        [ "$(sc '{.status.racks.rack1.updatedMembers}')" = "$want" ] || return 1
                        [ "$(sc '{.status.conditions[?(@.type=="Progressing")].status}')" = "False" ] || return 1
                        [ "$(sc '{.status.conditions[?(@.type=="Degraded")].status}')" = "False" ] || return 1
                        [ "$(members | grep -c .)" = "$want" ] || return 1
                      }

                      wait_ready() {
                        until cluster_ready; do
                          check_deadline
                          every_minute "waiting for the cluster to be ready: $(status_line)"
                          sleep 15
                        done
                        log "cluster ready: $(status_line)"
                      }

                      # --- Scylla Manager ---------------------------------------------------------
                      manager_id() {
                        tries=${1:-240}
                        MID=$(sc '{.status.managerId}')
                        while [ -z "$MID" ]; do
                          tries=$((tries - 1))
                          [ "$tries" -gt 0 ] || return 1
                          check_deadline
                          every_minute "waiting for Scylla Manager to register the cluster"
                          sleep 15
                          MID=$(sc '{.status.managerId}')
                        done
                      }

                      # Manager needs CQL credentials for schema backup/restore once auth is on.
                      manager_login() {
                        sctool cluster update -c "$MID" -u "$ADMIN_USER" -p "$ADMIN_PASSWORD" >/dev/null 2>&1 ||
                          log "warning: could not set CQL credentials in Scylla Manager"
                      }

                      # run_task <sctool args...>: create a task, wait for it; progress in LAST_PROGRESS.
                      run_task() {
                        out=$(sctool "$@" -c "$MID" 2>&1) || { echo "$out"; return 1; }
                        task=$(echo "$out" | grep -Eo '(backup|restore)/[0-9a-f-]{36}' | head -1)
                        [ -n "$task" ] || { echo "$out"; return 1; }
                        log "started $task"
                        while :; do
                          check_deadline
                          LAST_PROGRESS=$(sctool progress -c "$MID" "$task" 2>&1 || true)
                          st=$(echo "$LAST_PROGRESS" | sed -n 's/^Status:[[:space:]]*//p' | head -1)
                          case "$st" in
                            DONE*) log "$task done"; return 0 ;;
                            ERROR* | ABORTED* | STOPPED*) echo "$LAST_PROGRESS"; return 1 ;;
                          esac
                          every_minute "$task: ${st:-pending}"
                          sleep 15
                        done
                      }

                      take_backup() {
                        wait_ready
                        manager_id || die "cluster is not registered with Scylla Manager"
                        manager_login
                        run_task backup -L "$LOCATION" || die "backup failed"
                        TAG=$(echo "$LAST_PROGRESS" | grep -Eo 'sm_[0-9]{14}UTC' | head -1)
                        [ -n "$TAG" ] || die "backup finished but reported no snapshot tag"
                        log "snapshot $TAG stored in $LOCATION"
                      }

                      # Schema restore is not idempotent. Restore and start always run against a
                      # cluster the same workflow just created empty, so a user keyspace present
                      # before the schema step can only be left over from a failed attempt.
                      drop_partial_schema() {
                        pod=$(members | head -1)
                        for ks in $(echo "SELECT keyspace_name FROM system_schema.keyspaces;" |
                          k exec -i "$pod" -c scylla -- cqlsh /var/lib/scylla/cql.m 2>/dev/null |
                          awk 'NR>2 && NF==1 && $1 !~ /^(system|audit)/ {print $1}'); do
                          log "dropping keyspace $ks left by an earlier restore attempt"
                          echo "DROP KEYSPACE IF EXISTS \"$ks\";" | k exec -i "$pod" -c scylla -- cqlsh /var/lib/scylla/cql.m >/dev/null
                        done
                      }

                      # restore_snapshot <tag> <state-configmap>: schema, then tables; resumable.
                      restore_snapshot() {
                        tag=$1 state=$2
                        wait_ready
                        manager_id || die "cluster is not registered with Scylla Manager"
                        manager_login
                        if [ "$(cm_get "$state" schema)" != "$tag" ]; then
                          drop_partial_schema
                          run_task restore -L "$LOCATION" -T "$tag" --restore-schema || die "schema restore of $tag failed"
                          cm_put "$state" --from-literal=schema="$tag"
                        fi
                        if [ "$(cm_get "$state" tables)" != "$tag" ]; then
                          run_task restore -L "$LOCATION" -T "$tag" --restore-tables || die "table restore of $tag failed"
                          cm_put "$state" --from-literal=schema="$tag" --from-literal=tables="$tag"
                        fi
                        log "restored snapshot $tag"
                      }

                      # Each member has its own load balancer (spec.exposeOptions); name them in the
                      # instance's DNS zone through the cell's external-dns. CONTACT_HOST is the
                      # instance's Omnistrate endpoint name (<label>.<instance zone>, published as
                      # the CQL endpoint): it goes to member 0, node-<n>.<instance zone> to every
                      # member. The operator gives all member Services the same annotations, so this
                      # is done per member.
                      sync_dns() {
                        [ "$(sc '{.spec.exposeOptions.nodeService.type}')" = LoadBalancer ] || return 0
                        if [ -z "${CONTACT_HOST:-}" ]; then
                          # restore targets get no endpoint name at render time; build Omnistrate's
                          # r-<resource id>.<instance>.<cell zone>, the zone being external-dns's domain filter
                          cell_zone=$(kubectl -n external-dns-ns get deploy external-dns -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null |
                            grep -o -- '--domain-filter=[^",]*' | head -1 | cut -d= -f2)
                          # the resource ID from the node label (a restore target renders the resource ID of another resource)
                          n0=$(k get pod "$(members | head -1)" -o jsonpath='{.spec.nodeName}' 2>/dev/null)
                          rid=$(kubectl get node "$n0" -o jsonpath='{.metadata.labels.omnistrate\.com/resource}' 2>/dev/null || true)
                          [ -z "$cell_zone" ] || [ -z "$rid" ] || CONTACT_HOST="$rid.$CLUSTER.$cell_zone"
                        fi
                        case "${CONTACT_HOST:-}" in
                          *."$CLUSTER".*) zone=${CONTACT_HOST#*.} ;;
                          *) log "warning: endpoint name '${CONTACT_HOST:-}' is not in the instance's DNS zone; member load balancers keep only their cloud names"; return 0 ;;
                        esac
                        for p in $(members); do
                          n=${p##*-}
                          h="node-$n.$zone"
                          [ "$n" != 0 ] || h="$CONTACT_HOST,$h"
                          k annotate svc "$p" "external-dns.alpha.kubernetes.io/hostname=$h" --overwrite >/dev/null
                        done
                        log "DNS: $CONTACT_HOST and node-<n>.$zone for $(members | grep -c .) members"
                      }

                      # --- operations ---------------------------------------------------------------
                      # ScyllaDB 2026.x creates no default superuser. Each member's maintenance
                      # socket grants superuser access without credentials, so the role is created
                      # through it; statements go over stdin to keep the password out of process args.
                      do_auth() {
                        wait_ready
                        pod=$(members | head -1)
                        printf 'CREATE ROLE IF NOT EXISTS "%s" WITH PASSWORD = '"'"'%s'"'"' AND SUPERUSER = true AND LOGIN = true;\n' \
                          "$ADMIN_USER" "$ADMIN_PASSWORD" | k exec -i "$pod" -c scylla -- cqlsh /var/lib/scylla/cql.m >/dev/null ||
                          die "could not create role $ADMIN_USER"
                        # shellcheck disable=SC2016 # expanded by the member's shell
                        printf '[PlainTextAuthProvider]\nusername = %s\npassword = %s\n' "$ADMIN_USER" "$ADMIN_PASSWORD" |
                          k exec -i "$pod" -c scylla -- sh -c 'f=$(mktemp); cat >"$f"; cqlsh --credentials "$f" "$0" 9042 -e "SELECT release_version FROM system.local" >/dev/null; rc=$?; rm -f "$f"; exit $rc' \
                            "$CLUSTER-client.$NS.svc" || die "role $ADMIN_USER was created but cannot log in over CQL"
                        log "CQL superuser $ADMIN_USER ready"
                        sync_dns
                      }

                      do_backup() {
                        if cluster_exists; then
                          take_backup
                        else
                          TAG=$(cm_get scylla-stop-snapshot snapshotTag)
                          [ -n "$TAG" ] || die "cluster does not exist and no stop snapshot is recorded"
                          log "instance is stopped; its data is the stop snapshot $TAG"
                        fi
                        cm_put "snap-$ARG" --from-literal=snapshotTag="$TAG" --from-literal=location="$LOCATION"
                        # the workflow reads the tag back from this object's status (snapshot metadata)
                        printf 'apiVersion: scylla.omnistrate.io/v1\nkind: ScyllaSnapshot\nmetadata:\n  name: %s\nspec:\n  cluster: %s\n' "$ARG" "$CLUSTER" |
                          k apply -f - >/dev/null
                        k patch scyllasnapshot "$ARG" --subresource=status --type merge \
                          -p "{\"status\":{\"ready\":true,\"snapshotTag\":\"$TAG\",\"location\":\"$LOCATION\"}}" >/dev/null
                      }

                      # Never fails: a failing deleteBackup would block instance deletion.
                      do_delete_backup() {
                        tag=$(cm_get "snap-$ARG" snapshotTag)
                        if [ -z "$tag" ]; then
                          log "no snapshot recorded for $ARG; nothing to delete"
                          return 0
                        fi
                        refs=$(k get configmap -o jsonpath='{range .items[*]}{.metadata.name}={.data.snapshotTag}{"\n"}{end}' |
                          grep "=$tag\$" | grep -vc "^snap-$ARG=" || true)
                        if [ "$tag" = "$(cm_get scylla-stop-snapshot snapshotTag)" ] || [ "$refs" -gt 0 ]; then
                          log "snapshot $tag is still used by another snapshot or by stop/start; keeping its files"
                        elif cluster_exists && manager_id 8; then
                          manager_login
                          # Manager deletes only snapshots of the running cluster: one taken before a
                          # stop/start (which re-registers the cluster under a new ID) stays in the bucket.
                          if ! out=$(sctool backup delete -c "$MID" -L "$LOCATION" -T "$tag" 2>&1); then
                            case "$out" in
                              *"not found"*) log "warning: $tag was taken by an earlier incarnation of this cluster (before a stop/start); Scylla Manager cannot delete it, its files stay in $LOCATION" ;;
                              *) log "warning: deleting $tag failed; files stay in $LOCATION: $out" ;;
                            esac
                          fi
                        else
                          log "warning: cluster is not running; files of $tag stay in $LOCATION"
                        fi
                        k delete configmap "snap-$ARG" --ignore-not-found >/dev/null
                        k delete scyllasnapshot "$ARG" --ignore-not-found >/dev/null
                      }

                      do_restore() {
                        [ -n "$ARG" ] || die "no snapshot tag in the restore metadata"
                        restore_snapshot "$ARG" scylla-restore-state
                      }

                      do_stop() {
                        if ! cluster_exists; then
                          log "cluster already stopped"
                          return 0
                        fi
                        take_backup
                        cm_put scylla-stop-snapshot --from-literal=snapshotTag="$TAG" --from-literal=location="$LOCATION" \
                          --from-literal=stoppedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                        log "deleting the cluster and its local NVMe volumes"
                        k delete scyllacluster "$CLUSTER" --wait=true --timeout=30m
                        k wait --for=delete pod -l "scylla/cluster=$CLUSTER" --timeout=30m || true
                        k delete pvc -l "scylla/cluster=$CLUSTER" --ignore-not-found --wait=true --timeout=10m
                        log "stopped; data is in snapshot $TAG"
                      }

                      do_start() {
                        tag=$(cm_get scylla-stop-snapshot snapshotTag)
                        if [ -z "$tag" ] || [ "$(cm_get scylla-stop-snapshot restored)" = "$tag" ]; then
                          log "no pending stop snapshot; nothing to restore"
                          wait_ready
                          return 0
                        fi
                        restore_snapshot "$tag" scylla-start-restore
                        k patch configmap scylla-stop-snapshot --type merge -p "{\"data\":{\"restored\":\"$tag\"}}" >/dev/null
                        k delete configmap scylla-start-restore --ignore-not-found >/dev/null
                      }

                      node_type() { kubectl get node "$1" -o jsonpath='{.metadata.labels.node\.kubernetes\.io/instance-type}' 2>/dev/null || true; }

                      all_on_type() {
                        [ -n "${DESIRED_INSTANCE_TYPE:-}" ] || return 0
                        for p in $(members); do
                          n=$(k get pod "$p" -o jsonpath='{.spec.nodeName}')
                          [ -n "$n" ] && [ "$(node_type "$n")" = "$DESIRED_INSTANCE_TYPE" ] || return 1
                        done
                      }

                      # A local NVMe volume is bound to one node. After an instance-type change the
                      # re-created pod can never reach it (its node is of the old type, cordoned for
                      # scale-down, or gone), so the member is replaced onto a new node: fresh
                      # volume, data streamed from the other replicas.
                      stranded() {
                        p=$1
                        pv=$(k get pvc "data-$p" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)
                        [ -n "$pv" ] || return 1
                        n=$(kubectl get pv "$pv" -o jsonpath='{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}' 2>/dev/null || true)
                        [ -n "$n" ] || return 1
                        kubectl get node "$n" >/dev/null 2>&1 || return 0
                        [ "$(kubectl get node "$n" -o jsonpath='{.spec.unschedulable}')" != "true" ] || return 0
                        [ -z "${DESIRED_INSTANCE_TYPE:-}" ] || [ "$(node_type "$n")" = "$DESIRED_INSTANCE_TYPE" ] || return 0
                        return 1
                      }

                      replace_stranded() {
                        want=$(sc '{.spec.datacenter.racks[0].members}')
                        for p in $(k get pod -l "$SEL" -o jsonpath='{range .items[?(@.status.phase=="Pending")]}{.metadata.name}{"\n"}{end}'); do
                          stranded "$p" || continue
                          # already being replaced (the label exists, even with an empty value)
                          ! k get svc -l scylla/replace -o name | grep -qx "service/$p" || continue
                          [ "$want" -ge 2 ] || die "member $p must move to a new node, but a 1-node cluster cannot move without losing its data; restore a backup into a new instance instead"
                          log "member $p cannot reach its local volume $(k get pvc "data-$p" -o jsonpath='{.spec.volumeName}'); replacing it on a new node"
                          k label svc "$p" scylla/replace="" --overwrite >/dev/null
                        done
                      }

                      do_reconcile() {
                        cluster_exists || die "cluster $CLUSTER does not exist"
                        until cluster_ready && all_on_type; do
                          check_deadline
                          replace_stranded
                          every_minute "waiting for the change to roll out: $(status_line)"
                          sleep 15
                        done
                        log "cluster ready: $(status_line)"
                        sync_dns
                      }

                      # Pod by pod, highest ordinal first; each pod comes back on its node with its
                      # local volume. (Not via spec.forceRedeploymentReason: the modify workflow
                      # re-applies the ScyllaCluster and would drop the field, restarting everything again.)
                      do_restart() {
                        cluster_exists || die "cluster $CLUSTER does not exist"
                        wait_ready
                        for p in $(members | sort -r); do
                          old=$(k get pod "$p" -o jsonpath='{.metadata.uid}')
                          log "restarting $p"
                          k delete pod "$p" --wait=true >/dev/null
                          until [ -n "$(k get pod "$p" -o jsonpath='{.metadata.uid}' 2>/dev/null)" ] &&
                            [ "$(k get pod "$p" -o jsonpath='{.metadata.uid}')" != "$old" ]; do
                            check_deadline
                            sleep 5
                          done
                          sleep 15
                          wait_ready
                        done
                      }

                      do_replace() {
                        p=$ARG
                        [ -n "$p" ] || die "no member given"
                        [ "$(k get svc "$p" -o jsonpath='{.metadata.labels.scylla/cluster}' 2>/dev/null)" = "$CLUSTER" ] ||
                          die "$p is not a member of $CLUSTER (members: $(members | tr '\n' ' '))"
                        [ "$(sc '{.spec.datacenter.racks[0].members}')" -ge 2 ] ||
                          die "a 1-node cluster cannot replace its only member without losing its data"
                        old=$(k get pod "$p" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
                        if [ "$OP" = replace-vm ]; then
                          node=$(k get pod "$p" -o jsonpath='{.spec.nodeName}' 2>/dev/null || true)
                          if [ -n "$node" ]; then
                            log "cordoning node $node"
                            kubectl cordon "$node" >/dev/null
                          fi
                        fi
                        log "replacing member $p"
                        k label svc "$p" scylla/replace="" --overwrite >/dev/null
                        until [ -n "$(k get pod "$p" -o jsonpath='{.metadata.uid}' 2>/dev/null)" ] &&
                          [ "$(k get pod "$p" -o jsonpath='{.metadata.uid}')" != "$old" ]; do
                          check_deadline
                          every_minute "waiting for $p to be re-created"
                          sleep 10
                        done
                        sleep 30
                        wait_ready
                        log "member $p replaced on node $(k get pod "$p" -o jsonpath='{.spec.nodeName}')"
                        [ -z "${node:-}" ] || log "node $node stays cordoned and is removed by the autoscaler once empty"
                      }

                      case "$OP" in
                        auth) do_auth ;;
                        backup) do_backup ;;
                        delete-backup) do_delete_backup ;;
                        restore) do_restore ;;
                        stop) do_stop ;;
                        start) do_start ;;
                        reconcile) do_reconcile ;;
                        restart) do_restart ;;
                        replace | replace-vm) do_replace ;;
                        *) die "unknown operation $OP" ;;
                      esac
            - name: apply-ops-sa
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
            - name: apply-ops-role
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: Role
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  rules:
                    - apiGroups:
                        - ''
                      resources:
                        - pods
                      verbs:
                        - get
                        - list
                        - watch
                        - delete
                    - apiGroups:
                        - ''
                      resources:
                        - pods/exec
                      verbs:
                        - create
                    - apiGroups:
                        - ''
                      resources:
                        - services
                      verbs:
                        - get
                        - list
                        - patch
                        - update
                    - apiGroups:
                        - ''
                      resources:
                        - persistentvolumeclaims
                      verbs:
                        - get
                        - list
                        - watch
                        - delete
                        - deletecollection
                    - apiGroups:
                        - ''
                      resources:
                        - configmaps
                      verbs:
                        - get
                        - list
                        - create
                        - update
                        - patch
                        - delete
                    - apiGroups:
                        - batch
                      resources:
                        - jobs
                      verbs:
                        - get
                        - patch
                    - apiGroups:
                        - scylla.omnistrate.io
                      resources:
                        - scyllasnapshots
                      verbs:
                        - get
                        - list
                        - create
                        - patch
                        - delete
                    - apiGroups:
                        - scylla.omnistrate.io
                      resources:
                        - scyllasnapshots/status
                      verbs:
                        - get
                        - patch
                    - apiGroups:
                        - scylla.scylladb.com
                      resources:
                        - scyllaclusters
                      verbs:
                        - get
                        - list
                        - watch
                        - patch
                        - delete
            - name: apply-ops-rolebinding
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  subjects:
                    - kind: ServiceAccount
                      name: "{{inputs.parameters.instanceId}}-ops"
                      namespace: "{{inputs.parameters.namespace}}"
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: Role
                    name: "{{inputs.parameters.instanceId}}-ops"
            - name: apply-ops-clusterrole
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRole
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  rules:
                    - apiGroups:
                        - ''
                      resources:
                        - nodes
                      verbs:
                        - get
                        - list
                        - patch
                    - apiGroups:
                        - ''
                      resources:
                        - persistentvolumes
                      verbs:
                        - get
            - name: apply-ops-clusterrolebinding
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  subjects:
                    - kind: ServiceAccount
                      name: "{{inputs.parameters.instanceId}}-ops"
                      namespace: "{{inputs.parameters.namespace}}"
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: "{{inputs.parameters.instanceId}}-ops"
            - name: apply-cluster
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: memberCount
                  - name: cpuQuantity
                  - name: memoryQuantity
                  - name: storageGiB
                  - name: scyllaVersion
                  - name: developerMode
                  - name: region
                  - name: instanceType
                  - name: planId
              resource:
                action: apply
                successCondition: "status.members == {{inputs.parameters.memberCount}}, status.readyMembers == {{inputs.parameters.memberCount}}, status.availableMembers == {{inputs.parameters.memberCount}}"
                manifest: |
                  apiVersion: scylla.scylladb.com/v1
                  kind: ScyllaCluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  spec:
                    repository: docker.io/scylladb/scylla
                    version: "{{inputs.parameters.scyllaVersion}}"
                    agentRepository: docker.io/scylladb/scylla-manager-agent
                    agentVersion: 3.12.0
                    developerMode: {{inputs.parameters.developerMode}}
                    automaticOrphanedNodeCleanup: true
                    podMetadata:
                      labels:
                        omnistrate.com/managed-by: omnistrate
                        omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                    datacenter:
                      name: dc1
                      racks:
                        - name: rack1
                          members: {{inputs.parameters.memberCount}}
                          scyllaConfig: "{{inputs.parameters.instanceId}}-scylla-config"
                          scyllaAgentConfig: "{{inputs.parameters.instanceId}}-agent-config"
                          storage:
                            storageClassName: omnistrate-local-nvme
                            capacity: "{{inputs.parameters.storageGiB}}Gi"
                          resources:
                            requests:
                              cpu: "{{inputs.parameters.cpuQuantity}}"
                              memory: "{{inputs.parameters.memoryQuantity}}"
                            limits:
                              cpu: "{{inputs.parameters.cpuQuantity}}"
                              memory: "{{inputs.parameters.memoryQuantity}}"
                          agentResources:
                            requests:
                              cpu: 200m
                              memory: 512Mi
                            limits:
                              cpu: 200m
                              memory: 512Mi
                          placement:
                            nodeAffinity:
                              requiredDuringSchedulingIgnoredDuringExecution:
                                nodeSelectorTerms:
                                  - matchExpressions:
                                      - key: omnistrate.com/managed-by
                                        operator: In
                                        values:
                                          - omnistrate
                                      - key: topology.kubernetes.io/region
                                        operator: In
                                        values:
                                          - "{{inputs.parameters.region}}"
                                      - key: node.kubernetes.io/instance-type
                                        operator: In
                                        values:
                                          - "{{inputs.parameters.instanceType}}"
                                      - key: omnistrate.com/resource-alias
                                        operator: In
                                        values:
                                          - scylladb
                                      - key: omnistrate.com/product-tier-id
                                        operator: In
                                        values:
                                          - "{{inputs.parameters.planId}}"
                            podAntiAffinity:
                              requiredDuringSchedulingIgnoredDuringExecution:
                                - labelSelector:
                                    matchLabels:
                                      scylla/cluster: "{{inputs.parameters.instanceId}}"
                                  matchLabelKeys:
                                    - scylla-operator.scylladb.com/pod-type
                                  topologyKey: kubernetes.io/hostname
                          volumes:
                            - name: gcs-credentials
                              secret:
                                secretName: "{{inputs.parameters.instanceId}}-gcs-credentials"
                          agentVolumeMounts:
                            - name: gcs-credentials
                              mountPath: /etc/scylla-manager-agent/gcs
                              readOnly: true
            - name: delete-job
              inputs:
                parameters:
                  - name: namespace
                  - name: jobName
              resource:
                action: delete
                flags:
                  - --ignore-not-found=true
                manifest: |
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: "{{inputs.parameters.jobName}}"
                    namespace: "{{inputs.parameters.namespace}}"
            - name: run-ops-job
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: op
                  - name: arg
                  - name: jobName
                  - name: instanceType
              resource:
                action: apply
                successCondition: status.succeeded > 0
                failureCondition: status.failed > 0
                manifest: |
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: "{{inputs.parameters.jobName}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels: &id001
                      app.kubernetes.io/name: scylla-ops
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  spec:
                    backoffLimit: 0
                    activeDeadlineSeconds: 21600
                    ttlSecondsAfterFinished: 604800
                    template:
                      metadata:
                        labels: *id001
                      spec:
                        restartPolicy: Never
                        serviceAccountName: "{{inputs.parameters.instanceId}}-ops"
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: omnistrate.com/control-plane
                                      operator: Exists
                        tolerations:
                          - key: CriticalAddonsOnly
                            operator: Exists
                            effect: NoSchedule
                          - key: components.gke.io/gke-managed-components
                            operator: Exists
                            effect: NoSchedule
                        initContainers:
                          - name: sctool
                            image: docker.io/scylladb/scylla-manager:3.12.0
                            command:
                              - cp
                              - /usr/bin/sctool
                              - /tools/sctool
                            volumeMounts:
                              - name: tools
                                mountPath: /tools
                        containers:
                          - name: ops
                            image: docker.io/alpine/kubectl:1.34.1
                            command:
                              - /bin/sh
                              - /scripts/ops.sh
                            env:
                              - name: OP
                                value: "{{inputs.parameters.op}}"
                              - name: ARG
                                value: "{{inputs.parameters.arg}}"
                              - name: NS
                                value: "{{inputs.parameters.namespace}}"
                              - name: CLUSTER
                                value: "{{inputs.parameters.instanceId}}"
                              - name: JOB_NAME
                                value: "{{inputs.parameters.jobName}}"
                              - name: DESIRED_INSTANCE_TYPE
                                value: "{{inputs.parameters.instanceType}}"
                              - name: SCYLLA_MANAGER_API_URL
                                value: http://scylla-manager.scylla-manager.svc/api/v1
                            envFrom:
                              - secretRef:
                                  name: "{{inputs.parameters.instanceId}}-ops"
                            resources:
                              requests:
                                cpu: 50m
                                memory: 64Mi
                            volumeMounts:
                              - name: tools
                                mountPath: /tools
                              - name: scripts
                                mountPath: /scripts
                        volumes:
                          - name: tools
                            emptyDir: {}
                          - name: scripts
                            configMap:
                              name: "{{inputs.parameters.instanceId}}-ops-scripts"
      modify:
        workflow:
          entrypoint: modify
          activeDeadlineSeconds: 21600
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: memberCount
                value: "{{ $var.memberCount }}"
              - name: cpuQuantity
                value: "{{ $var.cpuQuantity }}"
              - name: memoryQuantity
                value: "{{ $var.memoryQuantity }}"
              - name: storageGiB
                value: "{{ $var.storageGiB }}"
              - name: scyllaVersion
                value: "{{ $var.scyllaVersion }}"
              - name: developerMode
                value: "{{ $var.developerMode }}"
              - name: region
                value: "{{ $sys.deploymentCell.region }}"
              - name: instanceType
                value: "{{ $var.gcpInstanceType }}"
              - name: planId
                value: "{{ $func.tolower($sys.deployment.planID) }}"
              - name: adminUsername
                value: "{{ $var.adminUsername }}"
              - name: adminPassword
                value: "{{ $var.adminPassword }}"
              - name: contactHost
                value: "{{ $sys.network.externalClusterEndpoint }}"
              - name: backupGcsBucketName
                value: "{{ $var.backupGcsBucketName }}"
              - name: backupGcsCredentials
                value: "{{ $var.backupGcsCredentials }}"
          templates:
            - name: modify
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: memberCount
                  - name: cpuQuantity
                  - name: memoryQuantity
                  - name: storageGiB
                  - name: scyllaVersion
                  - name: developerMode
                  - name: region
                  - name: instanceType
                  - name: planId
                  - name: adminUsername
                  - name: adminPassword
                  - name: contactHost
                  - name: backupGcsBucketName
                  - name: backupGcsCredentials
              dag:
                tasks:
                  - name: agentconfig
                    template: apply-agent-config
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupGcsBucketName
                          value: "{{inputs.parameters.backupGcsBucketName}}"
                        - name: backupGcsCredentials
                          value: "{{inputs.parameters.backupGcsCredentials}}"
                  - name: gcscredentials
                    template: apply-gcs-credentials
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupGcsCredentials
                          value: "{{inputs.parameters.backupGcsCredentials}}"
                  - name: opssecret
                    template: apply-ops-secret
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: adminUsername
                          value: "{{inputs.parameters.adminUsername}}"
                        - name: adminPassword
                          value: "{{inputs.parameters.adminPassword}}"
                        - name: backupGcsBucketName
                          value: "{{inputs.parameters.backupGcsBucketName}}"
                        - name: contactHost
                          value: "{{inputs.parameters.contactHost}}"
                  - name: scyllaconfig
                    template: apply-scylla-config
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsscripts
                    template: apply-ops-scripts
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opssa
                    template: apply-ops-sa
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsrole
                    template: apply-ops-role
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsrolebinding
                    template: apply-ops-rolebinding
                    dependencies:
                      - opssa
                      - opsrole
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsclusterrole
                    template: apply-ops-clusterrole
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: opsclusterrolebinding
                    template: apply-ops-clusterrolebinding
                    dependencies:
                      - opssa
                      - opsclusterrole
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                  - name: applycluster
                    template: apply-cluster-async
                    dependencies:
                      - agentconfig
                      - scyllaconfig
                      - gcscredentials
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: memberCount
                          value: "{{inputs.parameters.memberCount}}"
                        - name: cpuQuantity
                          value: "{{inputs.parameters.cpuQuantity}}"
                        - name: memoryQuantity
                          value: "{{inputs.parameters.memoryQuantity}}"
                        - name: storageGiB
                          value: "{{inputs.parameters.storageGiB}}"
                        - name: scyllaVersion
                          value: "{{inputs.parameters.scyllaVersion}}"
                        - name: developerMode
                          value: "{{inputs.parameters.developerMode}}"
                        - name: region
                          value: "{{inputs.parameters.region}}"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
                        - name: planId
                          value: "{{inputs.parameters.planId}}"
                  - name: deletereconcile
                    template: delete-job
                    dependencies:
                      - applycluster
                      - opssecret
                      - opsscripts
                      - opsrolebinding
                      - opsclusterrolebinding
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: jobName
                          value: "{{inputs.parameters.instanceId}}-reconcile"
                  - name: reconcile
                    template: run-ops-job
                    dependencies:
                      - deletereconcile
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: op
                          value: reconcile
                        - name: arg
                          value: ''
                        - name: jobName
                          value: "{{inputs.parameters.instanceId}}-reconcile"
                        - name: instanceType
                          value: "{{inputs.parameters.instanceType}}"
            - name: apply-agent-config
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: backupGcsBucketName
                  - name: backupGcsCredentials
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-agent-config"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  type: Opaque
                  stringData:
                    scylla-manager-agent.yaml: |
                      gcs:
                        service_account_file: /etc/scylla-manager-agent/gcs/credentials.json
            - name: apply-gcs-credentials
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: backupGcsCredentials
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-gcs-credentials"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  type: Opaque
                  data:
                    credentials.json: "{{inputs.parameters.backupGcsCredentials}}"
            - name: apply-ops-secret
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: adminUsername
                  - name: adminPassword
                  - name: backupGcsBucketName
                  - name: contactHost
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  type: Opaque
                  stringData:
                    ADMIN_USER: "{{inputs.parameters.adminUsername}}"
                    ADMIN_PASSWORD: "{{inputs.parameters.adminPassword}}"
                    LOCATION: "gcs:{{inputs.parameters.backupGcsBucketName}}"
                    CONTACT_HOST: "{{inputs.parameters.contactHost}}"
            - name: apply-scylla-config
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-scylla-config"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  data:
                    scylla.yaml: |
                      authenticator: PasswordAuthenticator
                      authorizer: CassandraAuthorizer
            - name: apply-ops-scripts
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ConfigMap
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops-scripts"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  data:
                    ops.sh: |
                      #!/bin/sh
                      # ScyllaDB lifecycle operations run as Kubernetes Jobs by the Omnistrate
                      # workflows. One script, selected by $OP:
                      #   auth           create the customer's CQL superuser (create/restore/start)
                      #   backup         Scylla Manager backup; records the snapshot tag for restore
                      #   delete-backup  delete the files of one Omnistrate snapshot
                      #   restore        restore schema + tables from snapshot tag $ARG
                      #   stop           backup, then delete the cluster and its local NVMe volumes
                      #   start          restore the snapshot taken by stop (cluster re-created by the workflow)
                      #   reconcile      wait for a modify to settle; replace members whose local
                      #                  volume is stranded on an old node pool (instance-type change)
                      #   restart        rolling restart of every member, one pod at a time
                      #   replace        replace member $ARG (fresh local volume, data re-streamed)
                      #   replace-vm     cordon member $ARG's node, then replace it onto another node
                      # NOTE: never write a double opening brace here -- the workflow engine would
                      # try to template it.
                      set -eu
                      export PATH="/tools:$PATH"
                      : "${NS:?}" "${CLUSTER:?}" "${OP:?}"
                      ARG="${ARG:-}"
                      TIMEOUT="${TIMEOUT:-21000}"
                      START=$(date +%s)
                      LAST_LOG=0

                      log() { echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) [$OP] $*"; }
                      die() { log "ERROR: $*"; exit 1; }
                      k() { kubectl -n "$NS" "$@"; }
                      check_deadline() { [ $(($(date +%s) - START)) -lt "$TIMEOUT" ] || die "timed out after ${TIMEOUT}s"; }
                      every_minute() { now=$(date +%s); if [ $((now - LAST_LOG)) -ge 60 ]; then LAST_LOG=$now; log "$*"; fi; }
                      sc() { k get scyllacluster "$CLUSTER" -o jsonpath="$1" 2>/dev/null || true; }
                      cluster_exists() { k get scyllacluster "$CLUSTER" >/dev/null 2>&1; }
                      cm_get() { k get configmap "$1" -o jsonpath="{.data.$2}" 2>/dev/null || true; }
                      cm_put() { name=$1; shift; k create configmap "$name" "$@" --dry-run=client -o yaml | k apply -f - >/dev/null; }
                      SEL="scylla/cluster=$CLUSTER,scylla-operator.scylladb.com/pod-type=scylladb-node"
                      members() { k get pod -l "$SEL" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'; }

                      status_line() {
                        echo "want=$(sc '{.spec.datacenter.racks[0].members}') members=$(sc '{.status.members}') ready=$(sc '{.status.readyMembers}') available=$(sc '{.status.availableMembers}') updated=$(sc '{.status.racks.rack1.updatedMembers}') generation=$(sc '{.metadata.generation}')/$(sc '{.status.observedGeneration}')"
                      }

                      # All members exist, are ready and run the latest spec, and the operator is idle.
                      cluster_ready() {
                        want=$(sc '{.spec.datacenter.racks[0].members}')
                        [ -n "$want" ] || return 1
                        [ "$(sc '{.metadata.generation}')" = "$(sc '{.status.observedGeneration}')" ] || return 1
                        [ "$(sc '{.status.members}')" = "$want" ] || return 1
                        [ "$(sc '{.status.readyMembers}')" = "$want" ] || return 1
                        [ "$(sc '{.status.availableMembers}')" = "$want" ] || return 1
                        [ "$(sc '{.status.racks.rack1.updatedMembers}')" = "$want" ] || return 1
                        [ "$(sc '{.status.conditions[?(@.type=="Progressing")].status}')" = "False" ] || return 1
                        [ "$(sc '{.status.conditions[?(@.type=="Degraded")].status}')" = "False" ] || return 1
                        [ "$(members | grep -c .)" = "$want" ] || return 1
                      }

                      wait_ready() {
                        until cluster_ready; do
                          check_deadline
                          every_minute "waiting for the cluster to be ready: $(status_line)"
                          sleep 15
                        done
                        log "cluster ready: $(status_line)"
                      }

                      # --- Scylla Manager ---------------------------------------------------------
                      manager_id() {
                        tries=${1:-240}
                        MID=$(sc '{.status.managerId}')
                        while [ -z "$MID" ]; do
                          tries=$((tries - 1))
                          [ "$tries" -gt 0 ] || return 1
                          check_deadline
                          every_minute "waiting for Scylla Manager to register the cluster"
                          sleep 15
                          MID=$(sc '{.status.managerId}')
                        done
                      }

                      # Manager needs CQL credentials for schema backup/restore once auth is on.
                      manager_login() {
                        sctool cluster update -c "$MID" -u "$ADMIN_USER" -p "$ADMIN_PASSWORD" >/dev/null 2>&1 ||
                          log "warning: could not set CQL credentials in Scylla Manager"
                      }

                      # run_task <sctool args...>: create a task, wait for it; progress in LAST_PROGRESS.
                      run_task() {
                        out=$(sctool "$@" -c "$MID" 2>&1) || { echo "$out"; return 1; }
                        task=$(echo "$out" | grep -Eo '(backup|restore)/[0-9a-f-]{36}' | head -1)
                        [ -n "$task" ] || { echo "$out"; return 1; }
                        log "started $task"
                        while :; do
                          check_deadline
                          LAST_PROGRESS=$(sctool progress -c "$MID" "$task" 2>&1 || true)
                          st=$(echo "$LAST_PROGRESS" | sed -n 's/^Status:[[:space:]]*//p' | head -1)
                          case "$st" in
                            DONE*) log "$task done"; return 0 ;;
                            ERROR* | ABORTED* | STOPPED*) echo "$LAST_PROGRESS"; return 1 ;;
                          esac
                          every_minute "$task: ${st:-pending}"
                          sleep 15
                        done
                      }

                      take_backup() {
                        wait_ready
                        manager_id || die "cluster is not registered with Scylla Manager"
                        manager_login
                        run_task backup -L "$LOCATION" || die "backup failed"
                        TAG=$(echo "$LAST_PROGRESS" | grep -Eo 'sm_[0-9]{14}UTC' | head -1)
                        [ -n "$TAG" ] || die "backup finished but reported no snapshot tag"
                        log "snapshot $TAG stored in $LOCATION"
                      }

                      # Schema restore is not idempotent. Restore and start always run against a
                      # cluster the same workflow just created empty, so a user keyspace present
                      # before the schema step can only be left over from a failed attempt.
                      drop_partial_schema() {
                        pod=$(members | head -1)
                        for ks in $(echo "SELECT keyspace_name FROM system_schema.keyspaces;" |
                          k exec -i "$pod" -c scylla -- cqlsh /var/lib/scylla/cql.m 2>/dev/null |
                          awk 'NR>2 && NF==1 && $1 !~ /^(system|audit)/ {print $1}'); do
                          log "dropping keyspace $ks left by an earlier restore attempt"
                          echo "DROP KEYSPACE IF EXISTS \"$ks\";" | k exec -i "$pod" -c scylla -- cqlsh /var/lib/scylla/cql.m >/dev/null
                        done
                      }

                      # restore_snapshot <tag> <state-configmap>: schema, then tables; resumable.
                      restore_snapshot() {
                        tag=$1 state=$2
                        wait_ready
                        manager_id || die "cluster is not registered with Scylla Manager"
                        manager_login
                        if [ "$(cm_get "$state" schema)" != "$tag" ]; then
                          drop_partial_schema
                          run_task restore -L "$LOCATION" -T "$tag" --restore-schema || die "schema restore of $tag failed"
                          cm_put "$state" --from-literal=schema="$tag"
                        fi
                        if [ "$(cm_get "$state" tables)" != "$tag" ]; then
                          run_task restore -L "$LOCATION" -T "$tag" --restore-tables || die "table restore of $tag failed"
                          cm_put "$state" --from-literal=schema="$tag" --from-literal=tables="$tag"
                        fi
                        log "restored snapshot $tag"
                      }

                      # Each member has its own load balancer (spec.exposeOptions); name them in the
                      # instance's DNS zone through the cell's external-dns. CONTACT_HOST is the
                      # instance's Omnistrate endpoint name (<label>.<instance zone>, published as
                      # the CQL endpoint): it goes to member 0, node-<n>.<instance zone> to every
                      # member. The operator gives all member Services the same annotations, so this
                      # is done per member.
                      sync_dns() {
                        [ "$(sc '{.spec.exposeOptions.nodeService.type}')" = LoadBalancer ] || return 0
                        if [ -z "${CONTACT_HOST:-}" ]; then
                          # restore targets get no endpoint name at render time; build Omnistrate's
                          # r-<resource id>.<instance>.<cell zone>, the zone being external-dns's domain filter
                          cell_zone=$(kubectl -n external-dns-ns get deploy external-dns -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null |
                            grep -o -- '--domain-filter=[^",]*' | head -1 | cut -d= -f2)
                          # the resource ID from the node label (a restore target renders the resource ID of another resource)
                          n0=$(k get pod "$(members | head -1)" -o jsonpath='{.spec.nodeName}' 2>/dev/null)
                          rid=$(kubectl get node "$n0" -o jsonpath='{.metadata.labels.omnistrate\.com/resource}' 2>/dev/null || true)
                          [ -z "$cell_zone" ] || [ -z "$rid" ] || CONTACT_HOST="$rid.$CLUSTER.$cell_zone"
                        fi
                        case "${CONTACT_HOST:-}" in
                          *."$CLUSTER".*) zone=${CONTACT_HOST#*.} ;;
                          *) log "warning: endpoint name '${CONTACT_HOST:-}' is not in the instance's DNS zone; member load balancers keep only their cloud names"; return 0 ;;
                        esac
                        for p in $(members); do
                          n=${p##*-}
                          h="node-$n.$zone"
                          [ "$n" != 0 ] || h="$CONTACT_HOST,$h"
                          k annotate svc "$p" "external-dns.alpha.kubernetes.io/hostname=$h" --overwrite >/dev/null
                        done
                        log "DNS: $CONTACT_HOST and node-<n>.$zone for $(members | grep -c .) members"
                      }

                      # --- operations ---------------------------------------------------------------
                      # ScyllaDB 2026.x creates no default superuser. Each member's maintenance
                      # socket grants superuser access without credentials, so the role is created
                      # through it; statements go over stdin to keep the password out of process args.
                      do_auth() {
                        wait_ready
                        pod=$(members | head -1)
                        printf 'CREATE ROLE IF NOT EXISTS "%s" WITH PASSWORD = '"'"'%s'"'"' AND SUPERUSER = true AND LOGIN = true;\n' \
                          "$ADMIN_USER" "$ADMIN_PASSWORD" | k exec -i "$pod" -c scylla -- cqlsh /var/lib/scylla/cql.m >/dev/null ||
                          die "could not create role $ADMIN_USER"
                        # shellcheck disable=SC2016 # expanded by the member's shell
                        printf '[PlainTextAuthProvider]\nusername = %s\npassword = %s\n' "$ADMIN_USER" "$ADMIN_PASSWORD" |
                          k exec -i "$pod" -c scylla -- sh -c 'f=$(mktemp); cat >"$f"; cqlsh --credentials "$f" "$0" 9042 -e "SELECT release_version FROM system.local" >/dev/null; rc=$?; rm -f "$f"; exit $rc' \
                            "$CLUSTER-client.$NS.svc" || die "role $ADMIN_USER was created but cannot log in over CQL"
                        log "CQL superuser $ADMIN_USER ready"
                        sync_dns
                      }

                      do_backup() {
                        if cluster_exists; then
                          take_backup
                        else
                          TAG=$(cm_get scylla-stop-snapshot snapshotTag)
                          [ -n "$TAG" ] || die "cluster does not exist and no stop snapshot is recorded"
                          log "instance is stopped; its data is the stop snapshot $TAG"
                        fi
                        cm_put "snap-$ARG" --from-literal=snapshotTag="$TAG" --from-literal=location="$LOCATION"
                        # the workflow reads the tag back from this object's status (snapshot metadata)
                        printf 'apiVersion: scylla.omnistrate.io/v1\nkind: ScyllaSnapshot\nmetadata:\n  name: %s\nspec:\n  cluster: %s\n' "$ARG" "$CLUSTER" |
                          k apply -f - >/dev/null
                        k patch scyllasnapshot "$ARG" --subresource=status --type merge \
                          -p "{\"status\":{\"ready\":true,\"snapshotTag\":\"$TAG\",\"location\":\"$LOCATION\"}}" >/dev/null
                      }

                      # Never fails: a failing deleteBackup would block instance deletion.
                      do_delete_backup() {
                        tag=$(cm_get "snap-$ARG" snapshotTag)
                        if [ -z "$tag" ]; then
                          log "no snapshot recorded for $ARG; nothing to delete"
                          return 0
                        fi
                        refs=$(k get configmap -o jsonpath='{range .items[*]}{.metadata.name}={.data.snapshotTag}{"\n"}{end}' |
                          grep "=$tag\$" | grep -vc "^snap-$ARG=" || true)
                        if [ "$tag" = "$(cm_get scylla-stop-snapshot snapshotTag)" ] || [ "$refs" -gt 0 ]; then
                          log "snapshot $tag is still used by another snapshot or by stop/start; keeping its files"
                        elif cluster_exists && manager_id 8; then
                          manager_login
                          # Manager deletes only snapshots of the running cluster: one taken before a
                          # stop/start (which re-registers the cluster under a new ID) stays in the bucket.
                          if ! out=$(sctool backup delete -c "$MID" -L "$LOCATION" -T "$tag" 2>&1); then
                            case "$out" in
                              *"not found"*) log "warning: $tag was taken by an earlier incarnation of this cluster (before a stop/start); Scylla Manager cannot delete it, its files stay in $LOCATION" ;;
                              *) log "warning: deleting $tag failed; files stay in $LOCATION: $out" ;;
                            esac
                          fi
                        else
                          log "warning: cluster is not running; files of $tag stay in $LOCATION"
                        fi
                        k delete configmap "snap-$ARG" --ignore-not-found >/dev/null
                        k delete scyllasnapshot "$ARG" --ignore-not-found >/dev/null
                      }

                      do_restore() {
                        [ -n "$ARG" ] || die "no snapshot tag in the restore metadata"
                        restore_snapshot "$ARG" scylla-restore-state
                      }

                      do_stop() {
                        if ! cluster_exists; then
                          log "cluster already stopped"
                          return 0
                        fi
                        take_backup
                        cm_put scylla-stop-snapshot --from-literal=snapshotTag="$TAG" --from-literal=location="$LOCATION" \
                          --from-literal=stoppedAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                        log "deleting the cluster and its local NVMe volumes"
                        k delete scyllacluster "$CLUSTER" --wait=true --timeout=30m
                        k wait --for=delete pod -l "scylla/cluster=$CLUSTER" --timeout=30m || true
                        k delete pvc -l "scylla/cluster=$CLUSTER" --ignore-not-found --wait=true --timeout=10m
                        log "stopped; data is in snapshot $TAG"
                      }

                      do_start() {
                        tag=$(cm_get scylla-stop-snapshot snapshotTag)
                        if [ -z "$tag" ] || [ "$(cm_get scylla-stop-snapshot restored)" = "$tag" ]; then
                          log "no pending stop snapshot; nothing to restore"
                          wait_ready
                          return 0
                        fi
                        restore_snapshot "$tag" scylla-start-restore
                        k patch configmap scylla-stop-snapshot --type merge -p "{\"data\":{\"restored\":\"$tag\"}}" >/dev/null
                        k delete configmap scylla-start-restore --ignore-not-found >/dev/null
                      }

                      node_type() { kubectl get node "$1" -o jsonpath='{.metadata.labels.node\.kubernetes\.io/instance-type}' 2>/dev/null || true; }

                      all_on_type() {
                        [ -n "${DESIRED_INSTANCE_TYPE:-}" ] || return 0
                        for p in $(members); do
                          n=$(k get pod "$p" -o jsonpath='{.spec.nodeName}')
                          [ -n "$n" ] && [ "$(node_type "$n")" = "$DESIRED_INSTANCE_TYPE" ] || return 1
                        done
                      }

                      # A local NVMe volume is bound to one node. After an instance-type change the
                      # re-created pod can never reach it (its node is of the old type, cordoned for
                      # scale-down, or gone), so the member is replaced onto a new node: fresh
                      # volume, data streamed from the other replicas.
                      stranded() {
                        p=$1
                        pv=$(k get pvc "data-$p" -o jsonpath='{.spec.volumeName}' 2>/dev/null || true)
                        [ -n "$pv" ] || return 1
                        n=$(kubectl get pv "$pv" -o jsonpath='{.spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values[0]}' 2>/dev/null || true)
                        [ -n "$n" ] || return 1
                        kubectl get node "$n" >/dev/null 2>&1 || return 0
                        [ "$(kubectl get node "$n" -o jsonpath='{.spec.unschedulable}')" != "true" ] || return 0
                        [ -z "${DESIRED_INSTANCE_TYPE:-}" ] || [ "$(node_type "$n")" = "$DESIRED_INSTANCE_TYPE" ] || return 0
                        return 1
                      }

                      replace_stranded() {
                        want=$(sc '{.spec.datacenter.racks[0].members}')
                        for p in $(k get pod -l "$SEL" -o jsonpath='{range .items[?(@.status.phase=="Pending")]}{.metadata.name}{"\n"}{end}'); do
                          stranded "$p" || continue
                          # already being replaced (the label exists, even with an empty value)
                          ! k get svc -l scylla/replace -o name | grep -qx "service/$p" || continue
                          [ "$want" -ge 2 ] || die "member $p must move to a new node, but a 1-node cluster cannot move without losing its data; restore a backup into a new instance instead"
                          log "member $p cannot reach its local volume $(k get pvc "data-$p" -o jsonpath='{.spec.volumeName}'); replacing it on a new node"
                          k label svc "$p" scylla/replace="" --overwrite >/dev/null
                        done
                      }

                      do_reconcile() {
                        cluster_exists || die "cluster $CLUSTER does not exist"
                        until cluster_ready && all_on_type; do
                          check_deadline
                          replace_stranded
                          every_minute "waiting for the change to roll out: $(status_line)"
                          sleep 15
                        done
                        log "cluster ready: $(status_line)"
                        sync_dns
                      }

                      # Pod by pod, highest ordinal first; each pod comes back on its node with its
                      # local volume. (Not via spec.forceRedeploymentReason: the modify workflow
                      # re-applies the ScyllaCluster and would drop the field, restarting everything again.)
                      do_restart() {
                        cluster_exists || die "cluster $CLUSTER does not exist"
                        wait_ready
                        for p in $(members | sort -r); do
                          old=$(k get pod "$p" -o jsonpath='{.metadata.uid}')
                          log "restarting $p"
                          k delete pod "$p" --wait=true >/dev/null
                          until [ -n "$(k get pod "$p" -o jsonpath='{.metadata.uid}' 2>/dev/null)" ] &&
                            [ "$(k get pod "$p" -o jsonpath='{.metadata.uid}')" != "$old" ]; do
                            check_deadline
                            sleep 5
                          done
                          sleep 15
                          wait_ready
                        done
                      }

                      do_replace() {
                        p=$ARG
                        [ -n "$p" ] || die "no member given"
                        [ "$(k get svc "$p" -o jsonpath='{.metadata.labels.scylla/cluster}' 2>/dev/null)" = "$CLUSTER" ] ||
                          die "$p is not a member of $CLUSTER (members: $(members | tr '\n' ' '))"
                        [ "$(sc '{.spec.datacenter.racks[0].members}')" -ge 2 ] ||
                          die "a 1-node cluster cannot replace its only member without losing its data"
                        old=$(k get pod "$p" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
                        if [ "$OP" = replace-vm ]; then
                          node=$(k get pod "$p" -o jsonpath='{.spec.nodeName}' 2>/dev/null || true)
                          if [ -n "$node" ]; then
                            log "cordoning node $node"
                            kubectl cordon "$node" >/dev/null
                          fi
                        fi
                        log "replacing member $p"
                        k label svc "$p" scylla/replace="" --overwrite >/dev/null
                        until [ -n "$(k get pod "$p" -o jsonpath='{.metadata.uid}' 2>/dev/null)" ] &&
                          [ "$(k get pod "$p" -o jsonpath='{.metadata.uid}')" != "$old" ]; do
                          check_deadline
                          every_minute "waiting for $p to be re-created"
                          sleep 10
                        done
                        sleep 30
                        wait_ready
                        log "member $p replaced on node $(k get pod "$p" -o jsonpath='{.spec.nodeName}')"
                        [ -z "${node:-}" ] || log "node $node stays cordoned and is removed by the autoscaler once empty"
                      }

                      case "$OP" in
                        auth) do_auth ;;
                        backup) do_backup ;;
                        delete-backup) do_delete_backup ;;
                        restore) do_restore ;;
                        stop) do_stop ;;
                        start) do_start ;;
                        reconcile) do_reconcile ;;
                        restart) do_restart ;;
                        replace | replace-vm) do_replace ;;
                        *) die "unknown operation $OP" ;;
                      esac
            - name: apply-ops-sa
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: v1
                  kind: ServiceAccount
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
            - name: apply-ops-role
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: Role
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  rules:
                    - apiGroups:
                        - ''
                      resources:
                        - pods
                      verbs:
                        - get
                        - list
                        - watch
                        - delete
                    - apiGroups:
                        - ''
                      resources:
                        - pods/exec
                      verbs:
                        - create
                    - apiGroups:
                        - ''
                      resources:
                        - services
                      verbs:
                        - get
                        - list
                        - patch
                        - update
                    - apiGroups:
                        - ''
                      resources:
                        - persistentvolumeclaims
                      verbs:
                        - get
                        - list
                        - watch
                        - delete
                        - deletecollection
                    - apiGroups:
                        - ''
                      resources:
                        - configmaps
                      verbs:
                        - get
                        - list
                        - create
                        - update
                        - patch
                        - delete
                    - apiGroups:
                        - batch
                      resources:
                        - jobs
                      verbs:
                        - get
                        - patch
                    - apiGroups:
                        - scylla.omnistrate.io
                      resources:
                        - scyllasnapshots
                      verbs:
                        - get
                        - list
                        - create
                        - patch
                        - delete
                    - apiGroups:
                        - scylla.omnistrate.io
                      resources:
                        - scyllasnapshots/status
                      verbs:
                        - get
                        - patch
                    - apiGroups:
                        - scylla.scylladb.com
                      resources:
                        - scyllaclusters
                      verbs:
                        - get
                        - list
                        - watch
                        - patch
                        - delete
            - name: apply-ops-rolebinding
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  subjects:
                    - kind: ServiceAccount
                      name: "{{inputs.parameters.instanceId}}-ops"
                      namespace: "{{inputs.parameters.namespace}}"
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: Role
                    name: "{{inputs.parameters.instanceId}}-ops"
            - name: apply-ops-clusterrole
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRole
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  rules:
                    - apiGroups:
                        - ''
                      resources:
                        - nodes
                      verbs:
                        - get
                        - list
                        - patch
                    - apiGroups:
                        - ''
                      resources:
                        - persistentvolumes
                      verbs:
                        - get
            - name: apply-ops-clusterrolebinding
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
              resource:
                action: apply
                manifest: |
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: ClusterRoleBinding
                  metadata:
                    name: "{{inputs.parameters.instanceId}}-ops"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  subjects:
                    - kind: ServiceAccount
                      name: "{{inputs.parameters.instanceId}}-ops"
                      namespace: "{{inputs.parameters.namespace}}"
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: "{{inputs.parameters.instanceId}}-ops"
            - name: apply-cluster-async
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: memberCount
                  - name: cpuQuantity
                  - name: memoryQuantity
                  - name: storageGiB
                  - name: scyllaVersion
                  - name: developerMode
                  - name: region
                  - name: instanceType
                  - name: planId
              resource:
                action: apply
                manifest: |
                  apiVersion: scylla.scylladb.com/v1
                  kind: ScyllaCluster
                  metadata:
                    name: "{{inputs.parameters.instanceId}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels:
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  spec:
                    repository: docker.io/scylladb/scylla
                    version: "{{inputs.parameters.scyllaVersion}}"
                    agentRepository: docker.io/scylladb/scylla-manager-agent
                    agentVersion: 3.12.0
                    developerMode: {{inputs.parameters.developerMode}}
                    automaticOrphanedNodeCleanup: true
                    podMetadata:
                      labels:
                        omnistrate.com/managed-by: omnistrate
                        omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                    datacenter:
                      name: dc1
                      racks:
                        - name: rack1
                          members: {{inputs.parameters.memberCount}}
                          scyllaConfig: "{{inputs.parameters.instanceId}}-scylla-config"
                          scyllaAgentConfig: "{{inputs.parameters.instanceId}}-agent-config"
                          storage:
                            storageClassName: omnistrate-local-nvme
                            capacity: "{{inputs.parameters.storageGiB}}Gi"
                          resources:
                            requests:
                              cpu: "{{inputs.parameters.cpuQuantity}}"
                              memory: "{{inputs.parameters.memoryQuantity}}"
                            limits:
                              cpu: "{{inputs.parameters.cpuQuantity}}"
                              memory: "{{inputs.parameters.memoryQuantity}}"
                          agentResources:
                            requests:
                              cpu: 200m
                              memory: 512Mi
                            limits:
                              cpu: 200m
                              memory: 512Mi
                          placement:
                            nodeAffinity:
                              requiredDuringSchedulingIgnoredDuringExecution:
                                nodeSelectorTerms:
                                  - matchExpressions:
                                      - key: omnistrate.com/managed-by
                                        operator: In
                                        values:
                                          - omnistrate
                                      - key: topology.kubernetes.io/region
                                        operator: In
                                        values:
                                          - "{{inputs.parameters.region}}"
                                      - key: node.kubernetes.io/instance-type
                                        operator: In
                                        values:
                                          - "{{inputs.parameters.instanceType}}"
                                      - key: omnistrate.com/resource-alias
                                        operator: In
                                        values:
                                          - scylladb
                                      - key: omnistrate.com/product-tier-id
                                        operator: In
                                        values:
                                          - "{{inputs.parameters.planId}}"
                            podAntiAffinity:
                              requiredDuringSchedulingIgnoredDuringExecution:
                                - labelSelector:
                                    matchLabels:
                                      scylla/cluster: "{{inputs.parameters.instanceId}}"
                                  matchLabelKeys:
                                    - scylla-operator.scylladb.com/pod-type
                                  topologyKey: kubernetes.io/hostname
                          volumes:
                            - name: gcs-credentials
                              secret:
                                secretName: "{{inputs.parameters.instanceId}}-gcs-credentials"
                          agentVolumeMounts:
                            - name: gcs-credentials
                              mountPath: /etc/scylla-manager-agent/gcs
                              readOnly: true
            - name: delete-job
              inputs:
                parameters:
                  - name: namespace
                  - name: jobName
              resource:
                action: delete
                flags:
                  - --ignore-not-found=true
                manifest: |
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: "{{inputs.parameters.jobName}}"
                    namespace: "{{inputs.parameters.namespace}}"
            - name: run-ops-job
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: op
                  - name: arg
                  - name: jobName
                  - name: instanceType
              resource:
                action: apply
                successCondition: status.succeeded > 0
                failureCondition: status.failed > 0
                manifest: |
                  apiVersion: batch/v1
                  kind: Job
                  metadata:
                    name: "{{inputs.parameters.jobName}}"
                    namespace: "{{inputs.parameters.namespace}}"
                    labels: &id001
                      app.kubernetes.io/name: scylla-ops
                      omnistrate.com/instance: "{{inputs.parameters.instanceId}}"
                  spec:
                    backoffLimit: 0
                    activeDeadlineSeconds: 21600
                    ttlSecondsAfterFinished: 604800
                    template:
                      metadata:
                        labels: *id001
                      spec:
                        restartPolicy: Never
                        serviceAccountName: "{{inputs.parameters.instanceId}}-ops"
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: omnistrate.com/control-plane
                                      operator: Exists
                        tolerations:
                          - key: CriticalAddonsOnly
                            operator: Exists
                            effect: NoSchedule
                          - key: components.gke.io/gke-managed-components
                            operator: Exists
                            effect: NoSchedule
                        initContainers:
                          - name: sctool
                            image: docker.io/scylladb/scylla-manager:3.12.0
                            command:
                              - cp
                              - /usr/bin/sctool
                              - /tools/sctool
                            volumeMounts:
                              - name: tools
                                mountPath: /tools
                        containers:
                          - name: ops
                            image: docker.io/alpine/kubectl:1.34.1
                            command:
                              - /bin/sh
                              - /scripts/ops.sh
                            env:
                              - name: OP
                                value: "{{inputs.parameters.op}}"
                              - name: ARG
                                value: "{{inputs.parameters.arg}}"
                              - name: NS
                                value: "{{inputs.parameters.namespace}}"
                              - name: CLUSTER
                                value: "{{inputs.parameters.instanceId}}"
                              - name: JOB_NAME
                                value: "{{inputs.parameters.jobName}}"
                              - name: DESIRED_INSTANCE_TYPE
                                value: "{{inputs.parameters.instanceType}}"
                              - name: SCYLLA_MANAGER_API_URL
                                value: http://scylla-manager.scylla-manager.svc/api/v1
                            envFrom:
                              - secretRef:
                                  name: "{{inputs.parameters.instanceId}}-ops"
                            resources:
                              requests:
                                cpu: 50m
                                memory: 64Mi
                            volumeMounts:
                              - name: tools
                                mountPath: /tools
                              - name: scripts
                                mountPath: /scripts
                        volumes:
                          - name: tools
                            emptyDir: {}
                          - name: scripts
                            configMap:
                              name: "{{inputs.parameters.instanceId}}-ops-scripts"
      start:
        outputParameters: *id001
        workflow:
          entrypoint: start
          activeDeadlineSeconds: 21600
          arguments:
            parameters:
              - name: namespace
                value: "{{ $sys.namespace }}"
              - name: instanceId
                value: "{{ $sys.instanceId }}"
              - name: memberCount
                value: "{{ $var.memberCount }}"
              - name: cpuQuantity
                value: "{{ $var.cpuQuantity }}"
              - name: memoryQuantity
                value: "{{ $var.memoryQuantity }}"
              - name: storageGiB
                value: "{{ $var.storageGiB }}"
              - name: scyllaVersion
                value: "{{ $var.scyllaVersion }}"
              - name: developerMode
                value: "{{ $var.developerMode }}"
              - name: region
                value: "{{ $sys.deploymentCell.region }}"
              - name: instanceType
                value: "{{ $var.gcpInstanceType }}"
              - name: planId
                value: "{{ $func.tolower($sys.deployment.planID) }}"
              - name: adminUsername
                value: "{{ $var.adminUsername }}"
              - name: adminPassword
                value: "{{ $var.adminPassword }}"
              - name: contactHost
                value: "{{ $sys.network.externalClusterEndpoint }}"
              - name: backupGcsBucketName
                value: "{{ $var.backupGcsBucketName }}"
              - name: backupGcsCredentials
                value: "{{ $var.backupGcsCredentials }}"
          templates:
            - name: start
              inputs:
                parameters:
                  - name: namespace
                  - name: instanceId
                  - name: memberCount
                  - name: cpuQuantity
                  - name: memoryQuantity
                  - name: storageGiB
                  - name: scyllaVersion
                  - name: developerMode
                  - name: region
                  - name: instanceType
                  - name: planId
                  - name: adminUsername
                  - name: adminPassword
                  - name: contactHost
                  - name: backupGcsBucketName
                  - name: backupGcsCredentials
              dag:
                tasks:
                  - name: agentconfig
                    template: apply-agent-config
                    arguments:
                      parameters:
                        - name: namespace
                          value: "{{inputs.parameters.namespace}}"
                        - name: instanceId
                          value: "{{inputs.parameters.instanceId}}"
                        - name: backupGcsBucketName
                          value: "{{inputs.parameters.backupGcsBucketName}}"
                        - name: backupGcsCredentials
                          value: "{{inputs.parameters.backupGcsCredentials}}"
                  - name: gcscredentials
                    template: apply-gcs-credentials
                    arguments:
                      parameters:
                        - name: namespace
